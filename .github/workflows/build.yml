name: Build and publish

# Every push to main builds a signed APK.
# If version.properties holds a version that was not released yet, it is also
# published: a GitHub Release with the APK + the download page and version.json on GitHub Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.ver.outputs.publish }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME=$(grep '^VERSION_NAME=' version.properties | cut -d= -f2 | tr -d '\r ')
          CODE=$(grep '^VERSION_CODE=' version.properties | cut -d= -f2 | tr -d '\r ')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          if gh release view "v$NAME" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Version $NAME was already released - building only."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Version $NAME is new - will publish."
          fi

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Signing key secret KEYSTORE_B64 is missing"; exit 1; fi
          printf '%s' "$KEYSTORE_B64" | tr -d '\r\n \357\273\277' | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "HAKLATOT_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed APK
        env:
          HAKLATOT_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          HAKLATOT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          HAKLATOT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk haklatot.apk
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: haklatot-${{ steps.ver.outputs.name }}-build${{ github.run_number }}
          path: haklatot.apk

      - name: Create GitHub release
        if: steps.ver.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.ver.outputs.name }}" haklatot.apk \
            --title "גרסה ${{ steps.ver.outputs.name }}" \
            --notes-file release-notes.txt \
            --latest

      - name: Build download page
        if: steps.ver.outputs.publish == 'true'
        run: |
          mkdir _site
          cp -r site/* _site/
          jq -n \
            --argjson code "${{ steps.ver.outputs.code }}" \
            --arg name "${{ steps.ver.outputs.name }}" \
            --arg url "https://github.com/${{ github.repository }}/releases/download/v${{ steps.ver.outputs.name }}/haklatot.apk" \
            --rawfile notes release-notes.txt \
            '{versionCode: $code, versionName: $name, apkUrl: $url, notes: ($notes | rtrimstr("\n"))}' \
            > _site/version.json
          cat _site/version.json

      - uses: actions/upload-pages-artifact@v3
        if: steps.ver.outputs.publish == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
